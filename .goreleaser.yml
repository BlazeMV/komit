version: 2
project_name: komit
builds:
  - main: ./cmd/komit
    binary: komit
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
checksum:
  name_template: checksums.txt
changelog:
  use: git
